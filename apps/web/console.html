<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Android console</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="console">
  <div class="console-top">
    <a class="btn ghost" href="/">← Dashboard</a>
    <span id="console-title">Android console</span>
    <span id="console-state" class="pill">connecting…</span>
  </div>
  <div id="console-frame-wrap">
    <div id="console-loading" class="muted">Loading Android display…</div>
    <iframe id="console-frame" class="hidden" title="Android display"></iframe>
  </div>

  <script src="/js/console.js"></script>
</body>
</html>
